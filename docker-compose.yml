# Full production-shaped stack: Postgres, a one-shot migration job, TWO web instances behind a
# round-robin proxy, and the outbox relay worker. Two web replicas are deliberate: they prove
# realtime fan-out works across processes (an SSE client on one instance sees writes made
# through the other).
#
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up --build
#   open http://localhost:8080

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://fellow:fellow@postgres:5432/fellow
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fellow
      POSTGRES_PASSWORD: fellow
      POSTGRES_DB: fellow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fellow -d fellow"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: ., target: worker }
    command: ["npx", "tsx", "src/db/migrate.ts"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web-1: &web
    build: { context: ., target: web }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web-2: *web

  worker:
    build: { context: ., target: worker }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web-1, web-2]

volumes:
  pgdata:
