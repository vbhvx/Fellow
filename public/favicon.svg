<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="fel-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="fel-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="fel-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="fel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>
  <!-- Squircle Canvas with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fel-bg)" stroke="url(#fel-border)" stroke-width="1.2" />
  
  <!-- Under Loop: Primary Partner (Cyan -> Indigo) -->
  <rect x="14" y="21" width="22" height="26" rx="11" fill="none" stroke="url(#fel-blue)" stroke-width="6.5" />
  
  <!-- Over Loop: Synergy Partner (Rose -> Violet) with depth shadow -->
  <rect x="28" y="17" width="22" height="26" rx="11" fill="none" stroke="url(#fel-purple)" stroke-width="6.5" filter="url(#fel-shadow)" />
  
  <!-- 3D Interlock Weave: Blue passes over Purple at top cross-section -->
  <path d="M 28 21 C 32 21 36 24 36 28" fill="none" stroke="url(#fel-blue)" stroke-width="6.5" stroke-linecap="round" />
  
  <!-- Realtime Synchronization Nexus Core -->
  <circle cx="32" cy="32" r="3.2" fill="#ffffff" />
  <circle cx="32" cy="32" r="5.5" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
</svg>