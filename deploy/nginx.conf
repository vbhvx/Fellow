upstream fellow_web {
  # Round-robin on purpose: consecutive requests (and SSE connections) land on different
  # instances, which exercises the Postgres LISTEN/NOTIFY fan-out.
  server web-1:3000;
  server web-2:3000;
}

server {
  listen 80;

  location /api/v1/realtime/ {
    proxy_pass http://fellow_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://fellow_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (not append) so clients cannot spoof their IP to dodge rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
