name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fellow
          POSTGRES_PASSWORD: fellow
          POSTGRES_DB: fellow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fellow -d fellow_test"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      DATABASE_URL: postgresql://fellow:fellow@localhost:5432/fellow_test
      TEST_DATABASE_URL: postgresql://fellow:fellow@localhost:5432/fellow_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Migrations apply cleanly and are idempotent
        run: npm run db:migrate && npm run db:migrate
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with: { context: ., target: web, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build worker image
        uses: docker/build-push-action@v6
        with: { context: ., target: worker, push: false, cache-from: type=gha }
